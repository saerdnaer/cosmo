extend schema @link(url: "https://specs.apollo.dev/federation/v2.5", import: ["@key", "@inaccessible"])

interface Node {
  id: ID!
}

interface PublicationService {
  id: ID!
  name: String!
}

"IDs: poc:tv:<dvbId>"
type PublicationServiceTV implements Node & PublicationService @key(fields: "id") {
  id: ID!
  name: String!
  dvbId: Int!
}

"IDs: poc:radio:<dvbId>"
type PublicationServiceRadio implements Node & PublicationService @key(fields: "id") {
  id: ID!
  name: String!
  dvbId: Int!
}

type Query {
  "Lookup field for the node router plugin (route poc); hidden from clients."
  nodePoc(id: ID!): Node @inaccessible
}

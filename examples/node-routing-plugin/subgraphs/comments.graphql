extend schema @link(url: "https://specs.apollo.dev/federation/v2.5", import: ["@key", "@inaccessible"])

interface Node {
  id: ID!
}

"IDs: kmp:comments:<base64url reference>"
type Comment implements Node @key(fields: "id") {
  id: ID!
  text: String!
  article: Article!
}

type Article @key(fields: "id", resolvable: false) {
  id: ID!
}

type Query {
  "Lookup field for the node router plugin (route kmp:comments); hidden from clients."
  nodeComments(id: ID!): Node @inaccessible
}

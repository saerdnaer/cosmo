extend schema @link(url: "https://specs.apollo.dev/federation/v2.5", import: ["@key"])

interface Node {
  id: ID!
}

"IDs: kmp:comments:<base64url reference>"
type Comment implements Node @key(fields: "id") {
  id: ID!

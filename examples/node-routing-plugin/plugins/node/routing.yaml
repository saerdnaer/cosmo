# Routing table of the node plugin.
#
# Each route maps an ID prefix to the subgraph that owns those IDs. For a
# Kompass ID (kmp:<domain>:...) the prefix is kmp:<domain>; for other IDs it is
# the first segment (e.g. poc for poc:tv:28106).
#
#   subgraph  Name of the subgraph in the graph. The router passes the routing
#             URLs of all subgraphs (after overrides) to the plugin on start.
#   url       Optional: call this URL instead, e.g. for a service outside the graph.
#   resolver  Optional: lookup field on that subgraph. Default: "node" + the
#             capitalised last prefix segment (kmp:cms -> nodeCms).
#
# The plugin asks the subgraph directly (not via the router):
#   query($id: ID!) { <resolver>(id: $id) { __typename } }
#
# ${VAR} and ${VAR:-default} are expanded from the environment.
routes:
  kmp:cms:
    subgraph: cms-dgs
  kmp:comments:
    subgraph: comments-dgs
  poc:
    subgraph: poc-dgs
    # poc-dgs's own publicationService(id) moved to this plugin; the subgraph
    # keeps it under a domain-specific name.
    resolver: publicationServicePoc

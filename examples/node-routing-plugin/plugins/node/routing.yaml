# Routing table of the node plugin.
#
# Each route maps an ID prefix to the subgraph that owns those IDs. For a
# Kompass ID (kmp:<domain>:...) the prefix is kmp:<domain>; for other IDs it is
# the first segment (e.g. poc for poc:tv:28106).
#
# The plugin asks the subgraph's lookup field for the concrete type of the ID:
#   query($id: ID!) { node<Domain>(id: $id) { __typename } }
# The field defaults to "node" + the capitalised last prefix segment
# (kmp:cms -> nodeCms) and can be overridden with `field`.
#
# ${VAR} is expanded from the environment, so URLs can differ per stage.
routes:
  kmp:cms:
    url: ${CMS_SUBGRAPH_URL:-http://localhost:4001/graphql}
  kmp:comments:
    url: ${COMMENTS_SUBGRAPH_URL:-http://localhost:4002/graphql}
  poc:
    url: ${POC_SUBGRAPH_URL:-http://localhost:4003/graphql}

"""
Root fields whose objects are spread over several subgraphs.

The plugin never loads domain data. It works out the concrete type of an ID
and returns a stub `{ __typename, id }`. The router resolves every other
selected field through the regular `_entities` lookup on the subgraph that owns
that type.
"""
type Query {
  """
  Fetches any object by its global ID (Relay Global Object Identification).
  """
  node(id: ID!): Node
  """
  Fetches a publication service (TV or radio station) by ID, whether it lives in
  the CMS (`kmp:cms:<ref>`) or in the programme service (`poc:tv:<dvbId>`,
  `poc:radio:<dvbId>`).
  """
  publicationService(id: ID!): PublicationService
}

interface Node {
  id: ID!
}

interface PublicationService {
  id: ID!
}

type Article implements Node @key(fields: "id", resolvable: false) {
  id: ID!
}

type Comment implements Node @key(fields: "id", resolvable: false) {
  id: ID!
}

type PublicationServiceCmsTV implements Node & PublicationService @key(fields: "id", resolvable: false) {
  id: ID!
}

type PublicationServiceTV implements Node & PublicationService @key(fields: "id", resolvable: false) {
  id: ID!
}

type PublicationServiceRadio implements Node & PublicationService @key(fields: "id", resolvable: false) {
  id: ID!
}
